plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flexrouteapp.twa'
    compileSdk 36

    defaultConfig {
        applicationId "com.flexrouteapp.twa"   // Must match your existing Play Store package name
        minSdk 24                               // Android 7.0+ — Play automatic protection requires 24 or higher
        targetSdk 36
        versionCode 9                          // Must be higher than your current TWA versionCode
        versionName "1.0.6"

        // Required for WebView file chooser on older Android
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false                 // Keep false — no code to obfuscate
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Use your existing keystore — same signing key as your TWA
    // Uncomment and fill in after adding your keystore file to the app/ folder:
    //
    // signingConfigs {
    //     release {
    //         storeFile     file('your-keystore.jks')
    //         storePassword 'your-store-password'
    //         keyAlias      'your-key-alias'
    //         keyPassword   'your-key-password'
    //     }
    // }
    // buildTypes {
    //     release {
    //         signingConfig signingConfigs.release
    //     }
    // }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    // No other dependencies needed — pure WebView, no third-party SDKs
}
